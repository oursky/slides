defaults REDIS
 mode tcp
 timeout connect  4s
 timeout server  30s
 timeout client  30s

frontend ft_redis
 bind 0.0.0.0:6379 name redis
 default_backend bk_redis

backend bk_redis
  option tcp-check
  tcp-check send AUTH\ 1234\r\n
  tcp-check expect string +OK
  # Ping to check basic connectivity
  tcp-check send PING\r\n
  tcp-check expect string +PONG
  # Check for the master role
  tcp-check send info\ replication\r\n
  tcp-check expect string role:master
  # Terminate connection cleanly
  tcp-check send QUIT\r\n
  tcp-check expect string +OK

  server R1 redis1:6379 check inter 1s
  server R2 redis2:6379 check inter 1s
